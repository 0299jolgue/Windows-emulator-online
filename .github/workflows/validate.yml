name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python
        run: python3 -m py_compile main.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Show launcher help
        run: python3 main.py --help
